backend:
  name: github
  repo: Fabio-Tiago/depaco
  branch: main

media_folder: public/uploads
public_folder: /uploads

locale: pt

collections:
  - name: blog
    label: "Posts do Blog"
    folder: content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Título", name: title, widget: string, required: true }
      - { label: "Descrição (SEO)", name: description, widget: text, required: true }
      - { label: "Data", name: date, widget: datetime, required: true }
      - { label: "Autor", name: author, widget: string, default: "Equipe DEPACO" }
      - { label: "Imagem de capa", name: cover, widget: image, required: false }
      - { label: "Tags", name: tags, widget: list, required: false, default: [] }
      - { label: "Personagem relacionado", name: related_personagem, widget: string, required: false }
      - { label: "Conteúdo", name: body, widget: markdown, required: true }