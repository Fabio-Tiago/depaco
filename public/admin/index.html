<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEPACO Admin</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Container do Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Customização visual do Decap (paleta DEPACO)
      CMS.registerPreviewStyle(`
        body {
          font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
          color: #1F1F1F;
          background: #FDFBF7;
          padding: 2rem;
          line-height: 1.6;
        }
        h1, h2, h3 {
          font-family: 'Fredoka', system-ui, sans-serif;
          font-weight: 700;
        }
        h1 { color: #E04E32; font-size: 2.5rem; }
        h2 { color: #1F1F1F; font-size: 1.8rem; margin-top: 2rem; }
        h3 { color: #1F1F1F; font-size: 1.3rem; }
        a { color: #F87956; }
        code {
          background: #FEF7E5;
          padding: 0.2em 0.4em;
          border-radius: 4px;
        }
        blockquote {
          border-left: 4px solid #F4B936;
          padding-left: 1rem;
          color: #555;
        }
      `, { raw: true });
    </script>
  </body>
</html>
